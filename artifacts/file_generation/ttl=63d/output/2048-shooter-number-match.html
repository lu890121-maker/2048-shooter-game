<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>2048 射击：数字合成</title>
    <style>
:root {
  --bg: #0f172a;
  --surface: #1e293b;
  --surface-soft: #273449;
  --text: #f8fafc;
  --muted: #94a3b8;
  --accent: #38bdf8;
  --danger: #f87171;
  --success: #49af85;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  height: 100%;
  background: radial-gradient(circle at top, #1b2845 0%, var(--bg) 68%);
  color: var(--text);
  font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow: hidden;
  user-select: none;
}

.app-shell {
  max-width: 480px;
  height: 100dvh;
  margin: 0 auto;
  padding: 6px 12px 6px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.top-bar,
.stats-row,
.launcher-bar,
.controls-hint {
  width: var(--board-frame-w, 100%);
  margin-left: auto;
  margin-right: auto;
}

.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.brand h1 {
  font-size: 1.02rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.1;
}

.brand .subtitle {
  font-size: 0.72rem;
  color: var(--muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.top-actions {
  display: flex;
  gap: 6px;
}

.icon-btn {
  background: var(--surface);
  color: var(--text);
  border: 1px solid rgba(148, 163, 184, 0.22);
  border-radius: 9px;
  padding: 4px 7px;
  font-size: 0.7rem;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.1s ease, background 0.15s ease;
}

.icon-btn:hover {
  background: var(--surface-soft);
}

.icon-btn:active {
  transform: scale(0.96);
}

.icon-btn.danger:hover {
  border-color: rgba(248, 113, 113, 0.55);
  color: #fecaca;
}

.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.stat-card {
  background: var(--surface);
  border: 1px solid rgba(148, 163, 184, 0.16);
  border-radius: 12px;
  padding: 4px 8px;
  text-align: center;
}

.stat-label {
  display: block;
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 0.08em;
}

.stat-value {
  font-size: 0.96rem;
  font-weight: 800;
}

.board-stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 260px;
  display: flex;
  align-items: center;
  justify-content: center;
}

#game-canvas {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: manipulation;
  cursor: pointer;
}

.feedback-toast {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: rgba(15, 23, 42, 0.92);
  color: #fecaca;
  border: 1px solid rgba(248, 113, 113, 0.5);
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 0.78rem;
  font-weight: 600;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease, transform 0.18s ease;
}

.feedback-toast.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.launcher-bar {
  background: var(--surface);
  border: 1px solid rgba(148, 163, 184, 0.18);
  border-radius: 16px;
  padding: 5px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.launcher-slot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}

.slot-label {
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 0.08em;
}

.tile-badge {
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  border-radius: 13px;
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-bottom: 4px solid rgba(0, 0, 0, 0.28);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 4px 12px rgba(0, 0, 0, 0.25);
  text-shadow: 0 1.5px 3px rgba(0, 0, 0, 0.3);
}

.tile-badge.current {
  width: 34px;
  height: 34px;
}

.tile-badge.next {
  width: 34px;
  height: 34px;
  opacity: 0.92;
}

.swap-wrap {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.swap-hint {
  font-size: 0.7rem;
  font-weight: 700;
  color: #fbbf24;
  opacity: 0;
  transform: translateY(2px);
  transition: opacity 0.15s ease;
}

.swap-hint.visible {
  opacity: 1;
}

.swap-btn {
  background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
  color: #ffffff;
  border: none;
  border-radius: 12px;
  padding: 7px 14px;
  font-size: 0.82rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
  transition: transform 0.1s ease, filter 0.15s ease;
}

.swap-btn:hover:not(:disabled) {
  filter: brightness(1.08);
}

.swap-btn:active:not(:disabled) {
  transform: scale(0.96);
}

.swap-btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.swap-btn.pulse-hint {
  animation: pulseHint 1.1s infinite ease-in-out;
}

@keyframes pulseHint {
  0%, 100% {
    transform: scale(1);
    box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.55);
  }
  50% {
    transform: scale(1.05);
    box-shadow: 0 0 0 8px rgba(251, 191, 36, 0);
  }
}

.controls-hint {
  text-align: center;
  font-size: 0.62rem;
  line-height: 1.1;
  color: var(--muted);
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(2, 6, 23, 0.76);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 50;
}

.modal-backdrop.open {
  display: flex;
}

.modal-card {
  width: 100%;
  max-width: 340px;
  background: var(--surface);
  border: 1px solid rgba(148, 163, 184, 0.25);
  border-radius: 20px;
  padding: 22px 20px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
}

.modal-card h2 {
  font-size: 1.55rem;
  font-weight: 800;
  margin-bottom: 4px;
}

.modal-sub {
  font-size: 0.82rem;
  color: var(--muted);
  margin-bottom: 16px;
}

.modal-metrics {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}

.metric-box {
  background: rgba(15, 23, 42, 0.65);
  border-radius: 12px;
  padding: 8px 6px;
}

.metric-box span {
  display: block;
  font-size: 0.65rem;
  color: var(--muted);
  font-weight: 700;
  text-transform: uppercase;
}

.metric-box strong {
  font-size: 1.05rem;
  font-weight: 800;
}

.modal-extra {
  font-size: 0.78rem;
  color: var(--muted);
  margin-bottom: 16px;
}

.play-again-btn {
  width: 100%;
  background: linear-gradient(180deg, #49af85 0%, #2f8f6b 100%);
  color: #ffffff;
  border: none;
  border-radius: 12px;
  padding: 12px;
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
}

.play-again-btn:hover {
  filter: brightness(1.08);
}

.skip-tut-btn {
  display: none;
  position: absolute;
  top: 10px;
  right: 12px;
  background: rgba(15, 23, 42, 0.85);
  color: #cbd5e1;
  border: 1px solid rgba(148, 163, 184, 0.3);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 0.74rem;
  font-weight: 700;
  cursor: pointer;
  z-index: 15;
}

.skip-tut-btn.visible {
  display: inline-block;
}

.current-slot {
  position: relative;
}

.current-slot.tut-highlight .tile-badge.current {
  box-shadow: 0 0 0 3px #fbbf24, 0 0 18px rgba(251, 191, 36, 0.65);
  animation: tutPulse 1s infinite ease-in-out;
}

.current-callout {
  display: none;
  position: absolute;
  bottom: calc(100% + 10px);
  left: -4px;
  background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
  color: #ffffff;
  font-size: 0.76rem;
  font-weight: 800;
  padding: 6px 12px;
  border-radius: 999px;
  white-space: nowrap;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
  animation: tutBounce 0.9s infinite ease-in-out;
  z-index: 20;
  pointer-events: none;
}

.current-callout::after {
  content: "";
  position: absolute;
  top: 100%;
  left: 18px;
  border-width: 6px;
  border-style: solid;
  border-color: #ef4444 transparent transparent transparent;
}

.next-slot.tut-highlight .current-callout {
  display: block;
}

@keyframes tutPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

@keyframes tutBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

</style>

  <body>
    <div id="app" class="app-shell">
      <header class="top-bar">
        <div class="brand">
          <h1>2048 射击</h1>
          <span class="subtitle">数字合成</span>
        </div>
        <div class="top-actions">
          <button id="btn-sound" class="icon-btn" type="button" aria-pressed="true">🔊 音效</button>
          <button id="btn-motion" class="icon-btn" type="button" aria-pressed="false">✨ 动效</button>
          <button id="btn-restart" class="icon-btn danger" type="button">↻ 重开</button>
        </div>
      </header>

      <section class="stats-row" aria-label="游戏数据">
        <div class="stat-card">
          <span class="stat-label">当前得分</span>
          <strong id="hud-score" class="stat-value">0</strong>
        </div>
        <div class="stat-card">
          <span class="stat-label">最高纪录</span>
          <strong id="hud-best" class="stat-value">0</strong>
        </div>
        <div class="stat-card">
          <span class="stat-label">最大数字</span>

      </section>

      <main class="board-stage">
        <canvas id="game-canvas" aria-label="5列7行数字射击棋盘"></canvas>
