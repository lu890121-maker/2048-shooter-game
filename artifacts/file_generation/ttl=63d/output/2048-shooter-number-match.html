        <button id="btn-skip-tutorial" class="skip-tut-btn" type="button">跳过引导</button>
      </main>

      <footer class="launcher-bar">
        <div id="current-slot" class="launcher-slot current-slot">
          <div id="current-callout" class="current-callout">👆 这里看即将发射</div>
          <span class="slot-label">即将发射</span>
          <div id="launcher-current" class="tile-badge current">2</div>
        </div>

        <div class="swap-wrap">
          <span id="swap-hint" class="swap-hint">建议交换数字！</span>
          <button id="btn-swap" class="swap-btn" type="button" title="交换即将发射与下一个数字 (快捷键 S)">
            ⇄ 交换
          </button>
        </div>

        <div class="launcher-slot">
          <span class="slot-label">下一个</span>
          <div id="launcher-next" class="tile-badge next">4</div>
        </div>
      </footer>

      <p class="controls-hint">按住左右拖动选列，松手发射 · 键盘 1–5 / ←→ + 空格 / S 交换</p>
    </div>

    <div id="gameover-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="go-title">
      <div class="modal-card">
        <h2 id="go-title">游戏结束</h2>
        <p class="modal-sub">即将发射与下下一个数字均无处可发射。</p>
        <div class="modal-metrics">
          <div class="metric-box">
            <span>本局得分</span>
            <strong id="go-score">0</strong>
          </div>
          <div class="metric-box">
            <span>历史最高</span>
            <strong id="go-best">0</strong>
          </div>
          <div class="metric-box">
            <span>最大数字</span>
            <strong id="go-biggest">0</strong>
          </div>
        </div>
        <p id="go-stats" class="modal-extra">合成次数: 0 · 最高连击: 0x</p>
        <button id="btn-play-again" class="play-again-btn" type="button">再来一局</button>
      </div>
    </div>

    <script>
(() => {
'use strict';
// --- src/config/GameConfig.ts ---




const GAME_CONFIG = {
  board: {
    cols: 5,
    maxRows: 7,
    capacity: 35,
    initialValues: [2, 4, 8],
    mergeMultiplier: 2,
    milestoneValue: 2048,
    celebrationMinValue: 256,
    maxSpawnValue: 256,
  },
  animation: {
    shootDurationMs: 220,
    mergeDurationMs: 200,
    gravityDurationMs: 160,
    chainStepPauseMs: 50,
    invalidShakeMs: 260,
    celebrationMs: 1700,
  },
  storageKeys: {
    bestScore: 'shooter2048_best_score',
    bestTile: 'shooter2048_best_tile',
    soundEnabled: 'shooter2048_sound_enabled',
    reducedMotion: 'shooter2048_reduced_motion',
    tutorialSeen: 'shooter2048_tutorial_seen',
    savedRun: 'shooter2048_saved_run',
  },
  spawnTable: [
    { value: 2, weight: 46, unlockAtBiggest: 0, retireAtBiggest: 256, enabled: true },
    { value: 4, weight: 34, unlockAtBiggest: 0, retireAtBiggest: 512, enabled: true },
    { value: 8, weight: 22, unlockAtBiggest: 0, retireAtBiggest: 1024, enabled: true },
    { value: 16, weight: 20, unlockAtBiggest: 64, retireAtBiggest: 2048, enabled: true },
    { value: 32, weight: 16, unlockAtBiggest: 128, enabled: true },
    { value: 64, weight: 12, unlockAtBiggest: 512, enabled: true },
    { value: 128, weight: 9, unlockAtBiggest: 1024, enabled: true },
    { value: 256, weight: 7, unlockAtBiggest: 2048, enabled: true },
  ],
};

const TILE_COLORS = {
  2: '#F5B700',
  4: '#FF8C42',
  8: '#FF5D8F',
  16: '#2EC4B6',
  32: '#4E89FF',
  64: '#9B5DE5',
  128: '#F15BB5',
  256: '#00BBF9',
  512: '#FB5607',
  1024: '#06D6A0',
  2048: '#E63946',
  4096: '#7209B7',
  8192: '#118AB2',
  16384: '#D90429',
  32768: '#3A86FF',
  65536: '#FF006E',
};

function getTileStyle(value){
  const bg = TILE_COLORS[value] ?? '#334155';
  const text = '#FFFFFF';
  return {
    bg,
    bgDark: shadeHex(bg, -18),
    text,
    glow: value >= 2048 ? bg : undefined,
  };
}

function shadeHex(hex, percent){
  const clean = hex.replace('#', '');
  const num = parseInt(clean, 16);
  const r = Math.max(0, Math.min(255, ((num >> 16) & 0xff) + Math.round((255 * percent) / 100)));
  const g = Math.max(0, Math.min(255, ((num >> 8) & 0xff) + Math.round((255 * percent) / 100)));
  const b = Math.max(0, Math.min(255, (num & 0xff) + Math.round((255 * percent) / 100)));
  return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
}


// --- src/core/GameState.ts ---
const GameState = {

  READY: 'READY',
  SHOOTING: 'SHOOTING',
  RESOLVING: 'RESOLVING',
  GAME_OVER: 'GAME_OVER',

};


// --- src/core/BoardManager.ts ---


class BoardManager {
  cols;
  maxRows;
  board;
  nextTileId = 1;

  constructor(cols = GAME_CONFIG.board.cols, maxRows = GAME_CONFIG.board.maxRows) {
    this.cols = cols;
    this.maxRows = maxRows;
    this.board = {
      columns: Array.from({ length: cols }, () => []),
    };
  }

  createTile(value){
    if (!Number.isFinite(value) || value <= 0) {
      throw new Error(`Invalid tile value: ${value}`);
    }
    return {
      id: this.nextTileId++,
      value,
    };
  }

  reset(){
    this.nextTileId = 1;
    this.board = {
      columns: Array.from({ length: this.cols }, () => []),
    };
  }

  loadColumns(columnsValues){
    if (columnsValues.length !== this.cols) {
      throw new Error(`Expected ${this.cols} columns, got ${columnsValues.length}`);
    }
    this.reset();
    for (let c = 0; c < this.cols; c++) {
      const colVals = columnsValues[c];
      if (colVals.length > this.maxRows) {
        throw new Error(`Column ${c} exceeds maxRows (${this.maxRows})`);
      }
      this.board.columns[c] = colVals.map((v) => this.createTile(v));
    }
  }

  getBoard(){
    return this.board;
  }

  cloneBoard(){
    return {
      columns: this.board.columns.map((col) => col.map((t) => ({ ...t }))),
    };
  }

  getColumn(col){
    if (!this.isValidCol(col)) return [];
    return this.board.columns[col];
  }

  getColumnLength(col){
    if (!this.isValidCol(col)) return 0;
    return this.board.columns[col].length;
  }

  isValidCol(col){
    return Number.isInteger(col) && col >= 0 && col < this.cols;
  }

  getTileAt(pos){
    if (!this.isValidCol(pos.col)) return null;
    const colTiles = this.board.columns[pos.col];
    if (pos.row < 0 || pos.row >= colTiles.length) return null;
    return colTiles[pos.row];
  }

  findTilePositionById(tileId){
    for (let c = 0; c < this.cols; c++) {
      const colTiles = this.board.columns[c];
      for (let r = 0; r < colTiles.length; r++) {
        if (colTiles[r].id === tileId) {
          return { col: c, row: r };
        }
      }
    }
    return null;
  }

  getOrthogonalNeighbors(pos) {
    const dirs = [
      { col: pos.col, row: pos.row - 1 },
      { col: pos.col, row: pos.row + 1 },
      { col: pos.col - 1, row: pos.row },
      { col: pos.col + 1, row: pos.row },
    ];
    const result = [];
    for (const d of dirs) {
      const tile = this.getTileAt(d);
      if (tile) {
        result.push({ pos: d, tile });
      }
    }
    return result;
  }

  canShootToColumn(col, value){
    if (!this.isValidCol(col)) return false;
    const colTiles = this.board.columns[col];
    if (colTiles.length < this.maxRows) {
      return true;
    }
    const bottomTile = colTiles[colTiles.length - 1];
    return bottomTile !== undefined && bottomTile.value === value;
  }

  getLandingRow(col){
    if (!this.isValidCol(col)) return -1;
    const len = this.board.columns[col].length;
    return len < this.maxRows ? len : this.maxRows - 1;
  }

  pushTileToColumn(col, tile){
    if (!this.isValidCol(col)) {
      throw new Error(`Invalid column: ${col}`);
    }
    const colTiles = this.board.columns[col];
    if (colTiles.length >= this.maxRows) {
      throw new Error(`Column ${col} is already full`);
    }
    const row = colTiles.length;
    colTiles.push(tile);
    return { col, row };
  }

  replaceTileAt(pos, newTile){
    if (!this.isValidCol(pos.col)) {
      throw new Error(`Invalid column: ${pos.col}`);
    }
    const colTiles = this.board.columns[pos.col];
    if (pos.row < 0 || pos.row >= colTiles.length) {
      throw new Error(`Invalid row ${pos.row} in column ${pos.col}`);
    }
    colTiles[pos.row] = newTile;
  }

  /**
   * Removes tiles by their IDs and compacts affected columns upward (no gaps).
   * Preserves tile identities and returns all vertical shifts that occurred.
   */
  removeTilesByIdsAndCompact(idsToRemove){
    const moves = [];
    for (let c = 0; c < this.cols; c++) {
      const oldCol = this.board.columns[c];
      let writeRow = 0;
      const newCol = [];
      let changed = false;

      for (let r = 0; r < oldCol.length; r++) {
        const tile = oldCol[r];
        if (idsToRemove.has(tile.id)) {
          changed = true;
          continue;
        }
        if (r !== writeRow) {
          moves.push({
            tileId: tile.id,
            value: tile.value,
            from: { col: c, row: r },
            to: { col: c, row: writeRow },
          });
        }
        newCol.push(tile);
        writeRow++;
      }

      if (changed) {
        this.board.columns[c] = newCol;
      }
    }
    return moves;
  }

  getBiggestTileValue(){
    let max = 0;
    for (let c = 0; c < this.cols; c++) {
      for (const tile of this.board.columns[c]) {
        if (tile.value > max) max = tile.value;
      }
    }
    return max;
  }

  getTotalTileCount(){
    let count = 0;
    for (let c = 0; c < this.cols; c++) {
      count += this.board.columns[c].length;
    }
    return count;
  }

  validateIntegrity() {
    const errors = [];
    const seenIds = new Set();

    if (this.board.columns.length !== this.cols) {
      errors.push(`Invalid column count: ${this.board.columns.length}`);
    }

    for (let c = 0; c < this.board.columns.length; c++) {
      const col = this.board.columns[c];
      if (col.length > this.maxRows) {
        errors.push(`Column ${c} exceeds maxRows (${col.length} > ${this.maxRows})`);
      }
      for (let r = 0; r < col.length; r++) {
        const tile = col[r];
        if (!tile) {
          errors.push(`Gap/undefined tile at (${c}, ${r})`);
          continue;
        }
        if (seenIds.has(tile.id)) {
          errors.push(`Duplicate tile ID ${tile.id} at (${c}, ${r})`);
        }
        seenIds.add(tile.id);
        if (!Number.isFinite(tile.value) || tile.value <= 0) {
          errors.push(`Invalid tile value ${tile.value} at (${c}, ${r})`);
        }
      }
    }

    return { valid: errors.length === 0, errors };
  }
}


// --- src/core/MergeSystem.ts ---




class MergeSystem {
  /**
   * Finds the connected orthogonal component of tiles with the same value starting at triggerPos.
   * Returns null if no orthogonal neighbor matches.
   */
  static findMergeGroup(board, triggerPos){
    const triggerTile = board.getTileAt(triggerPos);
    if (!triggerTile) return null;

    const visited = new Set([triggerTile.id]);
    const queue = [{ tile: { ...triggerTile }, pos: { ...triggerPos } }];
    const consumed = [];

    while (queue.length > 0) {
      const current = queue.shift();
      consumed.push(current);

      const neighbors = board.getOrthogonalNeighbors(current.pos);
      for (const n of neighbors) {
        if (n.tile.value === triggerTile.value && !visited.has(n.tile.id)) {
          visited.add(n.tile.id);
          queue.push({ tile: { ...n.tile }, pos: { ...n.pos } });
        }
      }
    }

    if (consumed.length <= 1) {
      return null;
    }

    const newValue = triggerTile.value * Math.pow(2, consumed.length - 1);
    const targetPos = MergeSystem.selectTargetPosition(
      consumed.map((c) => c.pos),
      triggerPos
    );

    return {
      baseValue: triggerTile.value,
      newValue,
      consumed,
      targetPos,
    };
  }

  /**
   * Deterministic target position rule:
   * 1. Highest position (smallest row).
   * 2. If tied at smallest row, prefer triggerPos.col if triggerPos is at that row.
   * 3. Otherwise smallest col.
   */
  static selectTargetPosition(positions, triggerPos){
    let minRow = Infinity;
    for (const p of positions) {
      if (p.row < minRow) minRow = p.row;
    }

    const topCandidates = positions.filter((p) => p.row === minRow);
    const triggerMatch = topCandidates.find(
      (p) => p.col === triggerPos.col && p.row === triggerPos.row
    );
    if (triggerMatch) {
      return { ...triggerMatch };
    }

    topCandidates.sort((a, b) => a.col - b.col);
    return { ...topCandidates[0] };
  }
}


// --- src/core/ChainResolver.ts ---





class ChainResolver {
  static resolveShot(
    board,
    col,
    shotTileId,
    shotValue){
    const colLen = board.getColumnLength(col);
    const merges = [];
    const checkQueue = [];
    const queuedSet = new Set();

    const enqueue = (tileId) => {
      if (!queuedSet.has(tileId)) {
        queuedSet.add(tileId);
        checkQueue.push(tileId);
      }
    };

    let landingRow;
    let isFullColumnDirectMerge = false;

    if (colLen < board.maxRows) {
      const shotTile = board.createTile(shotValue);
      // Preserve caller's intended shotTileId if needed? BoardManager assigns unique IDs.
      void shotTileId;
      const landedPos = board.pushTileToColumn(col, shotTile);
      landingRow = landedPos.row;
      enqueue(shotTile.id);
    } else {
      // Full column special rule: bottom tile (row = maxRows - 1) must match shotValue
      isFullColumnDirectMerge = true;
      landingRow = board.maxRows - 1;
      const anchorPos = { col, row: landingRow };
      const bottomTile = board.getTileAt(anchorPos);
      if (!bottomTile || bottomTile.value !== shotValue) {
        throw new Error(`Full column ${col} cannot accept value ${shotValue}`);
      }

      // Check orthogonal neighbors of anchorPos (including cross-column & above)
      const matchingNeighbors = board
        .getOrthogonalNeighbors(anchorPos)
        .filter((n) => n.tile.value === shotValue);

      const consumedBoardTiles = [
        { tile: { ...bottomTile }, pos: { ...anchorPos } },
        ...matchingNeighbors.map((n) => ({
          tile: { ...n.tile },
          pos: { ...n.pos },
        })),
      ];

      // Shot tile conceptually arrives from row = maxRows
      const virtualShotTile = {
        tile: { id: shotTileId, value: shotValue },
        pos: { col, row: board.maxRows },
      };

      const totalCount = consumedBoardTiles.length + 1;
      const newValue = shotValue * Math.pow(2, totalCount - 1);
      const targetPos = MergeSystem.selectTargetPosition(
        consumedBoardTiles.map((c) => c.pos),
        anchorPos
      );

      const mergedTile = board.createTile(newValue);
      board.replaceTileAt(targetPos, mergedTile);

      const idsToRemove = new Set();
      for (const c of consumedBoardTiles) {
        if (c.pos.col === targetPos.col && c.pos.row === targetPos.row) continue;
        idsToRemove.add(c.tile.id);
      }

      const gravityMoves = board.removeTilesByIdsAndCompact(idsToRemove);
      const finalTargetPos = board.findTilePositionById(mergedTile.id) ?? targetPos;

      merges.push({
        chainIndex: 1,
        baseValue: shotValue,
        newValue,
        scoreGain: newValue,
        consumed: [virtualShotTile, ...consumedBoardTiles],
        result: {
          tile: { ...mergedTile },
          pos: { ...finalTargetPos },
        },
        gravityMoves,
      });

      enqueue(mergedTile.id);
      for (const move of gravityMoves) {
        enqueue(move.tileId);
      }
    }

    // Chain loop: only newly created or gravity-shifted tiles are checked
    while (checkQueue.length > 0) {
      const tileId = checkQueue.shift();
      queuedSet.delete(tileId);

      const currentPos = board.findTilePositionById(tileId);
      if (!currentPos) continue; // Already consumed in an earlier merge

      const group = MergeSystem.findMergeGroup(board, currentPos);
      if (!group) continue;

      const mergedTile = board.createTile(group.newValue);
      board.replaceTileAt(group.targetPos, mergedTile);

      const idsToRemove = new Set();
      for (const c of group.consumed) {
        if (c.pos.col === group.targetPos.col && c.pos.row === group.targetPos.row) continue;
        idsToRemove.add(c.tile.id);
      }

      const gravityMoves = board.removeTilesByIdsAndCompact(idsToRemove);
      const finalTargetPos = board.findTilePositionById(mergedTile.id) ?? group.targetPos;

      merges.push({
        chainIndex: merges.length + 1,
        baseValue: group.baseValue,
        newValue: group.newValue,
        scoreGain: group.newValue,
        consumed: group.consumed,
        result: {
          tile: { ...mergedTile },
          pos: { ...finalTargetPos },
        },
        gravityMoves,
      });

      enqueue(mergedTile.id);
      for (const move of gravityMoves) {
        enqueue(move.tileId);
      }
    }

    let totalScoreGain = 0;
    for (const m of merges) {
      totalScoreGain += m.scoreGain;
    }

    return {
      landingRow,
      isFullColumnDirectMerge,
      merges,
      totalScoreGain,
      chainCount: merges.length,
    };
  }
}


// --- src/core/NumberGenerator.ts ---

class NumberGenerator {
  spawnTable;
  rng;
  constructor(seed, spawnTable = GAME_CONFIG.spawnTable) {
    this.spawnTable = spawnTable.map((item) => ({ ...item }));
    this.rng = seed !== undefined ? NumberGenerator.createSeededRng(seed) : Math.random;
  }

  static createSeededRng(seed) {
    let state = seed >>> 0;
    return () => {
      state += 0x6d2b79f5;
      let t = state;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  getEligibleConfigs(biggestTile){
    const eligible = this.spawnTable.filter((cfg) => {
      if (!cfg.enabled || cfg.weight <= 0) return false;
      if (biggestTile < cfg.unlockAtBiggest) return false;
      if (cfg.retireAtBiggest !== undefined && biggestTile >= cfg.retireAtBiggest) return false;
      if (cfg.value > GAME_CONFIG.board.maxSpawnValue) return false;
      return true;
    });

    if (eligible.length === 0) {
      return this.spawnTable.filter((cfg) => cfg.enabled && cfg.unlockAtBiggest === 0);
    }
    return eligible;
  }

  generateNext(biggestTile){
    const eligible = this.getEligibleConfigs(biggestTile);
    const totalWeight = eligible.reduce((sum, cfg) => sum + cfg.weight, 0);
    let roll = this.rng() * totalWeight;

    for (const cfg of eligible) {
      roll -= cfg.weight;
      if (roll <= 0) {
        return cfg.value;
      }
    }
    return eligible[eligible.length - 1].value;
  }
}


// --- src/core/ScoreManager.ts ---



class ScoreManager {
  score = 0;
  bestScore = 0;
  biggestTile = 0;
  allTimeBiggestTile = 0;
  reached2048 = false;
  mergeCount = 0;
  maxChainCount = 0;

  constructor(initialBestScore = 0, initialBestTile = 0) {
    this.bestScore = Math.max(0, initialBestScore);
    this.allTimeBiggestTile = Math.max(0, initialBestTile);
  }

  restoreRun(data){
    this.score = Math.max(0, data.score);
    if (this.score > this.bestScore) this.bestScore = this.score;
    this.biggestTile = Math.max(0, data.biggestTile);
    if (this.biggestTile > this.allTimeBiggestTile) this.allTimeBiggestTile = this.biggestTile;
    this.reached2048 = Boolean(data.reached2048);
    this.mergeCount = Math.max(0, data.mergeCount);
    this.maxChainCount = Math.max(0, data.maxChainCount);
  }

  resetRun(){
    this.score = 0;
    this.biggestTile = 0;
    this.reached2048 = false;
    this.mergeCount = 0;
    this.maxChainCount = 0;
  }

  recordResolution(
    scoreGain,
    chainCount,
    boardBiggestTile) {
    const prevBiggest = this.biggestTile;
    this.score += scoreGain;
    if (this.score > this.bestScore) {
      this.bestScore = this.score;
    }

    this.mergeCount += chainCount;
    if (chainCount > this.maxChainCount) {
      this.maxChainCount = chainCount;
    }

    if (boardBiggestTile > this.biggestTile) {
      this.biggestTile = boardBiggestTile;
    }
    if (this.biggestTile > this.allTimeBiggestTile) {
      this.allTimeBiggestTile = this.biggestTile;
    }

    let reached2048Now = false;
    if (!this.reached2048 && this.biggestTile >= GAME_CONFIG.board.milestoneValue) {
      this.reached2048 = true;
      reached2048Now = true;
    }

    let newMilestoneValue = null;
    if (
      chainCount > 0 &&
      boardBiggestTile > prevBiggest &&
      boardBiggestTile >= GAME_CONFIG.board.celebrationMinValue
    ) {
      newMilestoneValue = boardBiggestTile;
    }

    return { reached2048Now, newMilestoneValue };
  }

  syncBoardBiggestTile(boardBiggestTile){
    if (boardBiggestTile > this.biggestTile) {
      this.biggestTile = boardBiggestTile;
    }
    if (this.biggestTile > this.allTimeBiggestTile) {
      this.allTimeBiggestTile = this.biggestTile;
    }
    if (this.biggestTile >= GAME_CONFIG.board.milestoneValue) {
      this.reached2048 = true;
    }
  }

  getSnapshot(){
    return {
      score: this.score,
      bestScore: this.bestScore,
      biggestTile: this.biggestTile,
      allTimeBiggestTile: this.allTimeBiggestTile,
      reached2048: this.reached2048,
      mergeCount: this.mergeCount,
      maxChainCount: this.maxChainCount,
    };
  }
}


// --- src/core/GameOverChecker.ts ---

class GameOverChecker {
  static canShoot(board, value){
    for (let c = 0; c < board.cols; c++) {
      if (board.canShootToColumn(c, value)) {
        return true;
      }
    }
    return false;
  }

  static isGameOver(board, current, next){
    return !GameOverChecker.canShoot(board, current) && !GameOverChecker.canShoot(board, next);
  }

  static isSwapRecommended(board, current, next){
    return !GameOverChecker.canShoot(board, current) && GameOverChecker.canShoot(board, next);
  }
}


// --- src/core/GameManager.ts ---









class GameManager {
  board;
  generator;
  scoreManager;
  state = GameState.READY;
  currentNumber = 2;
  nextNumber = 4;
  virtualShotCounter = -1;

  constructor(options = {}) {
    this.board = new BoardManager();
    this.generator = new NumberGenerator(options.seed);
    this.scoreManager = new ScoreManager(options.initialBestScore, options.initialBestTile);
    this.initQueue();
  }

  initQueue(){
    const biggest = this.board.getBiggestTileValue();
    this.currentNumber = this.generator.generateNext(biggest);
    this.nextNumber = this.generator.generateNext(biggest);
  }

  reset(){
    this.board.reset();
    this.scoreManager.resetRun();
    this.state = GameState.READY;
    this.initQueue();
  }

  getState(){
    return this.state;
  }

  setState(newState){
    this.state = newState;
  }

  getBoardSnapshot(){
    return this.board.cloneBoard();
  }

  getCurrentNumber(){
    return this.currentNumber;
  }

  getNextNumber(){
    return this.nextNumber;
  }

  setQueueForTesting(current, next){
    this.currentNumber = current;
    this.nextNumber = next;
    this.evaluateStateAfterBoardChange();
  }

  exportRunState() {
    const snap = this.scoreManager.getSnapshot();
    return {
      columns: this.board.getBoard().columns.map((c) => c.map((t) => t.value)),
      current: this.currentNumber,
      next: this.nextNumber,
      score: snap.score,
      biggestTile: snap.biggestTile,
      reached2048: snap.reached2048,
      mergeCount: snap.mergeCount,
      maxChainCount: snap.maxChainCount,
    };
  }

  restoreRunState(data){
    this.board.loadColumns(data.columns);
    this.currentNumber = data.current;
    this.nextNumber = data.next;
    this.scoreManager.restoreRun(data);
    this.evaluateStateAfterBoardChange();
  }

  getScoreSnapshot(){
    return this.scoreManager.getSnapshot();
  }

  canShootToColumn(col){
    if (this.state !== GameState.READY) return false;
    return this.board.canShootToColumn(col, this.currentNumber);
  }

  isSwapRecommended(){
    if (this.state === GameState.GAME_OVER) return false;
    return GameOverChecker.isSwapRecommended(this.board, this.currentNumber, this.nextNumber);
  }

  swap(){
    if (this.state !== GameState.READY) {
      return false;
    }
    const prevCurrent = this.currentNumber;
    this.currentNumber = this.nextNumber;
    this.nextNumber = prevCurrent;
    return true;
  }

  shoot(col, deferReadyState = false){
    if (this.state !== GameState.READY) {
      return {
        ok: false,
        reason: 'NOT_READY',
        col,
        landingRow: -1,
        isFullColumnDirectMerge: false,
        merges: [],
        totalScoreGain: 0,
        chainCount: 0,
        reached2048Now: false,
        newMilestoneValue: null,
        gameOver: this.state === GameState.GAME_OVER,
        swapRecommended: false,
      };
    }

    if (!this.board.isValidCol(col)) {
      return {
        ok: false,
        reason: 'INVALID_COLUMN',
        col,
        landingRow: -1,
        isFullColumnDirectMerge: false,
        merges: [],
        totalScoreGain: 0,
        chainCount: 0,
        reached2048Now: false,
        newMilestoneValue: null,
        gameOver: false,
        swapRecommended: this.isSwapRecommended(),
      };
    }

    if (!this.board.canShootToColumn(col, this.currentNumber)) {
      return {
        ok: false,
        reason: 'COLUMN_FULL',
        col,
        landingRow: -1,
        isFullColumnDirectMerge: false,
        merges: [],
        totalScoreGain: 0,
        chainCount: 0,
        reached2048Now: false,
        newMilestoneValue: null,
        gameOver: false,
        swapRecommended: this.isSwapRecommended(),
      };
    }

    this.state = GameState.SHOOTING;
    const shotValue = this.currentNumber;
    const virtualShotId = this.virtualShotCounter--;

    this.state = GameState.RESOLVING;
    const resolution = ChainResolver.resolveShot(this.board, col, virtualShotId, shotValue);

    const biggestOnBoard = this.board.getBiggestTileValue();
    const { reached2048Now, newMilestoneValue } = this.scoreManager.recordResolution(
      resolution.totalScoreGain,
      resolution.chainCount,
      biggestOnBoard
    );

    this.currentNumber = this.nextNumber;
    this.nextNumber = this.generator.generateNext(this.scoreManager.getSnapshot().biggestTile);

    const gameOver = GameOverChecker.isGameOver(this.board, this.currentNumber, this.nextNumber);
    const swapRecommended =
      !gameOver && GameOverChecker.isSwapRecommended(this.board, this.currentNumber, this.nextNumber);

    if (!deferReadyState) {
      this.state = gameOver ? GameState.GAME_OVER : GameState.READY;
    }

    return {
      ok: true,
      col,
      shotTile: { id: virtualShotId, value: shotValue },
      landingRow: resolution.landingRow,
      isFullColumnDirectMerge: resolution.isFullColumnDirectMerge,
      merges: resolution.merges,
      totalScoreGain: resolution.totalScoreGain,
      chainCount: resolution.chainCount,
      reached2048Now,
      newMilestoneValue,
      gameOver,
      swapRecommended,
    };
  }

  finishAnimation(){
    if (this.state === GameState.GAME_OVER) return;
    const gameOver = GameOverChecker.isGameOver(this.board, this.currentNumber, this.nextNumber);
    this.state = gameOver ? GameState.GAME_OVER : GameState.READY;
  }

  evaluateStateAfterBoardChange(){
    this.scoreManager.syncBoardBiggestTile(this.board.getBiggestTileValue());
    const gameOver = GameOverChecker.isGameOver(this.board, this.currentNumber, this.nextNumber);
    this.state = gameOver ? GameState.GAME_OVER : GameState.READY;
  }
}


// --- src/systems/SaveManager.ts ---





class SaveManager {
  static readInt(key, fallback){
    try {
      const raw = localStorage.getItem(key);
      if (raw === null) return fallback;
      const val = parseInt(raw, 10);
      return Number.isFinite(val) && val >= 0 ? val : fallback;
    } catch {
      return fallback;
    }
  }

  static readBool(key, fallback){
    try {
      const raw = localStorage.getItem(key);
      if (raw === null) return fallback;
      return raw === 'true';
    } catch {
      return fallback;
    }
  }

  static write(key, value){
    try {
      localStorage.setItem(key, value);
    } catch {
      // Ignore storage quota/privacy mode errors
    }
  }

  static load(){
    const keys = GAME_CONFIG.storageKeys;
    return {
      bestScore: SaveManager.readInt(keys.bestScore, 0),
      bestTile: SaveManager.readInt(keys.bestTile, 0),
      soundEnabled: SaveManager.readBool(keys.soundEnabled, true),
      reducedMotion: SaveManager.readBool(keys.reducedMotion, false),
      tutorialSeen: SaveManager.readBool(keys.tutorialSeen, false),
    };
  }

  static saveBestScore(score){
    SaveManager.write(GAME_CONFIG.storageKeys.bestScore, String(Math.max(0, Math.floor(score))));
  }

  static saveBestTile(tileValue){
    SaveManager.write(GAME_CONFIG.storageKeys.bestTile, String(Math.max(0, Math.floor(tileValue))));
  }

  static saveSoundEnabled(enabled){
    SaveManager.write(GAME_CONFIG.storageKeys.soundEnabled, String(enabled));
  }

  static saveReducedMotion(enabled){
    SaveManager.write(GAME_CONFIG.storageKeys.reducedMotion, String(enabled));
  }

  static saveTutorialSeen(seen){
    SaveManager.write(GAME_CONFIG.storageKeys.tutorialSeen, String(seen));
  }

  static saveRunState(run){
    SaveManager.write(GAME_CONFIG.storageKeys.savedRun, JSON.stringify(run));
  }

  static loadRunState(){
    try {
      const raw = localStorage.getItem(GAME_CONFIG.storageKeys.savedRun);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed.columns) || parsed.columns.length !== GAME_CONFIG.board.cols) {
        return null;
      }
      return parsed;
    } catch {
      return null;
    }
  }

  static clearRunState(){
    try {
      localStorage.removeItem(GAME_CONFIG.storageKeys.savedRun);
    } catch {
      // Ignore
    }
  }
}


// --- src/systems/AudioManager.ts ---
class AudioManager {
  ctx = null;
  enabled;
  constructor(enabled = true) {
    this.enabled = enabled;
  }

  setEnabled(enabled){
    this.enabled = enabled;
  }

  isEnabled(){
    return this.enabled;
  }

  ensureContext(){
    if (!this.enabled) return null;
    if (typeof window === 'undefined') return null;
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || (window).webkitAudioContext;
      if (!AudioCtx) return null;
      this.ctx = new AudioCtx();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume().catch(() => {});
    }
    return this.ctx;
  }

  playTone(
    freq,
    durationSec,
    type = 'sine',
    volume = 0.12,
    delaySec = 0,
    endFreq){
    const ctx = this.ensureContext();
    if (!ctx) return;

    const now = ctx.currentTime + delaySec;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (endFreq !== undefined) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + durationSec);
    }

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(volume, now + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + durationSec);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(now);
    osc.stop(now + durationSec + 0.02);
  }

  playShoot(){
    this.playTone(320, 0.09, 'triangle', 0.1, 0, 540);
  }

  playMerge(chainIndex){
    const base = 360 * Math.pow(1.12, Math.min(chainIndex - 1, 8));
    this.playTone(base, 0.14, 'sine', 0.14, 0, base * 1.25);
  }

  playSwap(){
    this.playTone(440, 0.07, 'sine', 0.08, 0, 580);
  }

  playInvalid(){
    this.playTone(170, 0.12, 'sawtooth', 0.08, 0, 120);
  }

  playMilestone(value){
    if (value >= 2048) {
      const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
      notes.forEach((n, idx) => {
        this.playTone(n, 0.28, 'triangle', 0.15, idx * 0.065);
      });
    } else if (value >= 1024) {
      const notes = [493.88, 659.25, 783.99, 987.77];
      notes.forEach((n, idx) => {
        this.playTone(n, 0.24, 'triangle', 0.14, idx * 0.065);
      });
    } else {
      // 256, 512: uplifting major triad chime
      const notes = value >= 512 ? [440, 554.37, 659.25, 880] : [392, 493.88, 587.33];
      notes.forEach((n, idx) => {
        this.playTone(n, 0.2, 'triangle', 0.13, idx * 0.065);
      });
    }
  }

  play2048(){
    this.playMilestone(2048);
  }

  playGameOver(){
    const notes = [392, 349.23, 311.13, 261.63];
    notes.forEach((n, idx) => {
      this.playTone(n, 0.22, 'sine', 0.11, idx * 0.09);
    });
  }
}


// --- src/renderer/BoardLayout.ts ---




/**
 * Unified coordinate conversion for the entire game.
 * Reserves a dedicated launcher track below the 5x7 board so the aiming tile is never clipped.
 */
class BoardLayout {
  static compute(canvasWidth, canvasHeight){
    const cols = GAME_CONFIG.board.cols;
    const maxRows = GAME_CONFIG.board.maxRows;
    const padding = 6;
    const colGap = Math.max(6, Math.round(canvasWidth * 0.018));
    const rowGap = colGap;

    const availW = canvasWidth - padding * 2 - colGap * (cols - 1);
    // Reserve ~0.95 tile height below the 7 rows for the sliding launcher track
    const availH = canvasHeight - padding * 2 - rowGap * maxRows;
    const tileSize = Math.floor(Math.min(availW / cols, availH / (maxRows + 0.62)));

    const boardWidth = tileSize * cols + colGap * (cols - 1);
    const boardHeight = tileSize * maxRows + rowGap * (maxRows - 1);
    const launcherSize = Math.round(tileSize * 0.56);
    const trackGap = Math.max(7, Math.round(tileSize * 0.14));
    const totalHeight = boardHeight + trackGap + launcherSize;

    const boardX = Math.round((canvasWidth - boardWidth) / 2);
    const boardY = Math.max(padding, Math.round((canvasHeight - totalHeight) / 2));
    const launcherY = boardY + boardHeight + trackGap;

    return {
      canvasWidth,
      canvasHeight,
      cols,
      maxRows,
      tileSize,
      colGap,
      rowGap,
      boardX,
      boardY,
      boardWidth,
      boardHeight,
      launcherSize,
      launcherY,
      padding,
    };
  }

  static colToX(metrics, col){
    return metrics.boardX + col * (metrics.tileSize + metrics.colGap);
  }

  static rowToY(metrics, row){
    return metrics.boardY + row * (metrics.tileSize + metrics.rowGap);
  }

  static posToPixel(metrics, pos) {
    return {
      x: BoardLayout.colToX(metrics, pos.col),
      y: BoardLayout.rowToY(metrics, pos.row),
    };
  }

  static pixelToCol(metrics, x){
    const relX = x - metrics.boardX;
    if (relX < -16 || relX > metrics.boardWidth + 16) {
      return -1;
    }
    const stride = metrics.tileSize + metrics.colGap;
    const rawCol = Math.floor((relX + metrics.colGap * 0.5) / stride);
    return Math.max(0, Math.min(metrics.cols - 1, rawCol));
  }
}


// --- src/renderer/TileRenderer.ts ---



class TileRenderer {
  static drawTile(
    ctx,
    x,
    y,
    size,
    value,
    options = {}
  ){
    const scale = options.scale ?? 1;
    const alpha = options.alpha ?? 1;
    const style = getTileStyle(value);
    const radius = Math.max(9, Math.round(size * 0.18));

    ctx.save();
    ctx.globalAlpha = alpha;

    const cx = x + size / 2;
    const cy = y + size / 2;
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    ctx.translate(-size / 2, -size / 2);

    if (options.ghost) {
      ctx.strokeStyle = style.bg;
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 4]);
      TileRenderer.roundRectPath(ctx, 2, 2, size - 4, size - 4, radius);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = style.bg;
      ctx.globalAlpha = alpha * 0.18;
      ctx.fill();
      ctx.restore();
      return;
    }

    // Optional outer glow for 2048+
    if (style.glow) {
      ctx.shadowColor = style.glow;
      ctx.shadowBlur = 16;
    }

    const bevel = Math.max(3, Math.round(size * 0.08));
    const faceH = size - bevel;

    // Clip to outer rounded rect for razor-sharp anti-aliased edges
    ctx.save();
    TileRenderer.roundRectPath(ctx, 0.5, 0.5, size - 1, size - 1, radius);
    ctx.clip();

    // Bottom 3D lip
    ctx.fillStyle = style.bgDark;
    ctx.fillRect(0, 0, size, size);

    ctx.shadowBlur = 0;

    // Main candy face with subtle vertical gradient
    const grad = ctx.createLinearGradient(0, 0, 0, faceH);
    grad.addColorStop(0, style.bg);
    grad.addColorStop(1, style.bgDark);
    ctx.fillStyle = style.bg;
    TileRenderer.roundRectPath(ctx, 0.5, 0.5, size - 1, faceH, radius);
    ctx.fill();

    // Soft glossy top sheen
    const sheenGrad = ctx.createLinearGradient(0, 1, 0, faceH * 0.45);
    sheenGrad.addColorStop(0, 'rgba(255, 255, 255, 0.28)');
    sheenGrad.addColorStop(1, 'rgba(255, 255, 255, 0.0)');
    ctx.fillStyle = sheenGrad;
    TileRenderer.roundRectPath(ctx, 1.5, 1.5, size - 3, faceH * 0.45, Math.max(6, radius - 2));
    ctx.fill();

    // Crisp inner top-edge highlight
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.32)';
    ctx.lineWidth = 1.5;
    TileRenderer.roundRectPath(ctx, 1.25, 1.25, size - 2.5, faceH - 1.5, Math.max(6, radius - 1));
    ctx.stroke();

    ctx.restore(); // End clip

    // Clean outer edge stroke for crisp tile separation
    ctx.strokeStyle = options.highlight ? 'rgba(255, 255, 255, 0.9)' : 'rgba(15, 23, 42, 0.24)';
    ctx.lineWidth = options.highlight ? 2.5 : 1.25;
    TileRenderer.roundRectPath(ctx, 0.5, 0.5, size - 1, size - 1, radius);
    ctx.stroke();

    // Pure white number with subtle drop shadow for crisp legibility
    const text = String(value);
    const len = text.length;
    const fontScale = len <= 2 ? 0.43 : len === 3 ? 0.35 : len === 4 ? 0.28 : 0.23;
    const fontSize = Math.max(12, Math.round(size * fontScale));
    ctx.fillStyle = '#FFFFFF';
    ctx.font = `800 ${fontSize}px "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0, 0, 0, 0.28)';
    ctx.shadowBlur = 3;
    ctx.shadowOffsetY = 1.5;
    ctx.fillText(text, size / 2, faceH / 2 + 1, size * 0.86);

    ctx.restore();
  }

  static roundRectPath(
    ctx,
    x,
    y,
    w,
    h,
    r){
    const radius = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + w - radius, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
    ctx.lineTo(x + w, y + h - radius);
    ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
    ctx.lineTo(x + radius, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
  }
}


// --- src/renderer/AnimationManager.ts ---










class AnimationManager {
  phases = [];
  phaseElapsedMs = 0;
  onTimelineComplete = null;
  onPhaseMergeAudio = null;

  shakeCol = -1;
  shakeElapsedMs = 0;
  celebrationElapsedMs = -1;
  celebrationValue = 0;

  floatingTexts = [];
  particles = [];
  reducedMotion = false;

  constructor(audio) {
    this.audio = audio;}

  setReducedMotion(reduced){
    this.reducedMotion = reduced;
  }

  isAnimating(){
    return this.phases.length > 0;
  }

  hasActiveEffects(){
    return (
      this.phases.length > 0 ||
      this.shakeCol !== -1 ||
      this.celebrationElapsedMs >= 0 ||
      this.floatingTexts.length > 0 ||
      this.particles.length > 0
    );
  }

  reset(){
    this.phases = [];
    this.phaseElapsedMs = 0;
    this.onTimelineComplete = null;
    this.shakeCol = -1;
    this.shakeElapsedMs = 0;
    this.celebrationElapsedMs = -1;
    this.floatingTexts.length = 0;
    this.particles.length = 0;
  }

  triggerInvalidShake(col){
    this.shakeCol = col;
    this.shakeElapsedMs = 0;
  }

  getColumnShakeOffset(col){
    if (this.shakeCol !== col || this.reducedMotion) return 0;
    const t = this.shakeElapsedMs / GAME_CONFIG.animation.invalidShakeMs;
    if (t >= 1) return 0;
    return Math.sin(t * Math.PI * 5) * 6 * (1 - t);
  }

  triggerMilestoneCelebration(value){
    this.celebrationElapsedMs = 0;
    this.celebrationValue = value;
    if (!this.reducedMotion) {
      const style = getTileStyle(value);
      const colors = [style.bg, "#FBBF24", "#38BDF8", "#FFFFFF", "#49AF85"];
      for (let i = 0; i < 28; i++) {
        const angle = (Math.PI * 2 * i) / 28 + (Math.random() - 0.5) * 0.25;
        const speed = 110 + Math.random() * 190;
        this.particles.push({
          x: 0.5 + (Math.random() - 0.5) * 0.2,
          y: 0.3 + (Math.random() - 0.5) * 0.1,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 90,
          size: 4 + Math.random() * 4,
          color: colors[i % colors.length],
          elapsedMs: 0,
          durationMs: 900 + Math.random() * 400,
        });
      }
    }
  }

  getCelebrationState() {
    if (this.celebrationElapsedMs < 0) return null;
    return {
      progress: Math.min(1, this.celebrationElapsedMs / GAME_CONFIG.animation.celebrationMs),
      value: this.celebrationValue,
    };
  }

  startShotTimeline(
    boardBeforeShot,
    result,
    onComplete){
    const scale = this.reducedMotion ? 0.25 : 1;
    const shootMs = Math.round(GAME_CONFIG.animation.shootDurationMs * scale);
    const mergeMs = Math.round(GAME_CONFIG.animation.mergeDurationMs * scale);
    const gravityMs = Math.round(GAME_CONFIG.animation.gravityDurationMs * scale);

    this.phases = [];
    this.phaseElapsedMs = 0;
    this.onTimelineComplete = onComplete;
    this.onPhaseMergeAudio = (chainIdx) => this.audio?.playMerge(chainIdx);

    // Clone working board to step through visual states accurately
    const working = {
      columns: boardBeforeShot.columns.map((c) => c.map((t) => ({ ...t }))),
    };

    const shotValue = result.shotTile?.value ?? 2;
    const targetFlightRow = result.isFullColumnDirectMerge
      ? GAME_CONFIG.board.maxRows - 1
      : result.landingRow;

    this.phases.push({
      kind: 'SHOOT',
      col: result.col,
      toRow: targetFlightRow,
      value: shotValue,
      durationMs: shootMs,
      boardSnapshot: {
        columns: working.columns.map((c) => c.map((t) => ({ ...t }))),
      },
    });

    // If normal landing, place the shot tile into working board after SHOOT phase
    if (!result.isFullColumnDirectMerge && result.shotTile) {
      working.columns[result.col].push({ ...result.shotTile });
    }

    for (const ev of result.merges) {
      const boardBeforeMerge = {
        columns: working.columns.map((c) => c.map((t) => ({ ...t }))),
      };

      const hiddenIds = new Set(ev.consumed.map((c) => c.tile.id));

      this.phases.push({
        kind: 'MERGE',
        event: ev,
        durationMs: mergeMs,
        boardBeforeMerge,
        hiddenIds,
      });

      // Apply merge to working board (replace at targetPos, remove others, compact)
      const consumedIds = new Set(ev.consumed.map((c) => c.tile.id));
      // Find where result goes before compaction
      for (let c = 0; c < working.columns.length; c++) {
        working.columns[c] = working.columns[c]
          .map((t) => {
            if (
              ev.chainIndex === 1 &&
              result.isFullColumnDirectMerge &&
              c === ev.result.pos.col &&
              working.columns[c].indexOf(t) === ev.result.pos.row
            ) {
              return { ...ev.result.tile };
            }
            if (t.id === ev.result.tile.id) return { ...ev.result.tile };
            return t;
          })
          .filter((t) => {
            if (t.id === ev.result.tile.id) return true;
            // Keep the tile at result.pos if it was replaced
            return !consumedIds.has(t.id);
          });
      }

      // Ensure result tile is at ev.result.pos in working board
      const colArr = working.columns[ev.result.pos.col];
      const alreadyThere = colArr.some((t) => t.id === ev.result.tile.id);
      if (!alreadyThere) {
        colArr.splice(ev.result.pos.row, 0, { ...ev.result.tile });
      }

      if (ev.gravityMoves.length > 0) {
        const movedIds = new Set(ev.gravityMoves.map((m) => m.tileId));
        this.phases.push({
          kind: 'GRAVITY',
          event: ev,
          durationMs: gravityMs,
          boardAfterMerge: {
            columns: working.columns.map((c) => c.map((t) => ({ ...t }))),
          },
          movedIds,
        });
      }
    }

    if (result.newMilestoneValue !== null) {
      this.triggerMilestoneCelebration(result.newMilestoneValue);
    }
  }

  update(dtMs){
    if (this.shakeCol !== -1) {
      this.shakeElapsedMs += dtMs;
      if (this.shakeElapsedMs >= GAME_CONFIG.animation.invalidShakeMs) {
        this.shakeCol = -1;
      }
    }

    if (this.celebrationElapsedMs >= 0) {
      this.celebrationElapsedMs += dtMs;
      if (this.celebrationElapsedMs >= GAME_CONFIG.animation.celebrationMs) {
        this.celebrationElapsedMs = -1;
      }
    }

    for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
      this.floatingTexts[i].elapsedMs += dtMs;
      if (this.floatingTexts[i].elapsedMs >= this.floatingTexts[i].durationMs) {
        this.floatingTexts.splice(i, 1);
      }
    }

    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.elapsedMs += dtMs;
      p.x += (p.vx / 360) * (dtMs / 1000);
      p.y += (p.vy / 500) * (dtMs / 1000);
      p.vy += 360 * (dtMs / 1000);
      if (p.elapsedMs >= p.durationMs) {
        this.particles.splice(i, 1);
      }
    }

    if (this.phases.length === 0) return;

    this.phaseElapsedMs += dtMs;
    while (this.phases.length > 0 && this.phaseElapsedMs >= this.phases[0].durationMs) {
      const finished = this.phases.shift();
      this.phaseElapsedMs -= finished.durationMs;

      if (finished.kind === 'SHOOT' && this.phases[0]?.kind === 'MERGE') {
        const firstMerge = this.phases[0].event;
        this.spawnMergeEffects(firstMerge);
      } else if (finished.kind === 'MERGE' && this.phases[0]?.kind === 'MERGE') {
        this.spawnMergeEffects(this.phases[0].event);
      } else if (finished.kind === 'GRAVITY' && this.phases[0]?.kind === 'MERGE') {
        this.spawnMergeEffects(this.phases[0].event);
      }
    }

    if (this.phases.length === 0) {
      this.phaseElapsedMs = 0;
      const cb = this.onTimelineComplete;
      this.onTimelineComplete = null;
      cb?.();
    }
  }

  spawnMergeEffects(ev){
    this.onPhaseMergeAudio?.(ev.chainIndex);

    const style = getTileStyle(ev.newValue);
    this.floatingTexts.push({
      text: `+${ev.scoreGain}`,
      subtext: ev.chainIndex > 1 ? `CHAIN x${ev.chainIndex}!` : undefined,
      pos: { ...ev.result.pos },
      color: style.bg,
      elapsedMs: 0,
      durationMs: this.reducedMotion ? 350 : 750,
    });
  }

  /**
   * Computes which tiles to draw for the current animation frame.
   * Returns null when idle so renderer draws directly from GameManager board.
   */
  getFrameTiles(){
    if (this.phases.length === 0) return null;

    const phase = this.phases[0];
    const t = Math.min(1, this.phaseElapsedMs / Math.max(1, phase.durationMs));
    const eased = 1 - Math.pow(1 - t, 3);
    const draws = [];

    if (phase.kind === 'SHOOT') {
      this.pushBoardTiles(phase.boardSnapshot, draws);
      const startRow = GAME_CONFIG.board.maxRows + 0.5;
      const curRow = startRow + (phase.toRow - startRow) * eased;
      draws.push({
        id: -9999,
        value: phase.value,
        col: phase.col,
        row: curRow,
        scale: 1,
        alpha: 1,
      });
    } else if (phase.kind === 'MERGE') {
      this.pushBoardTiles(phase.boardBeforeMerge, draws, phase.hiddenIds);

      // Slide consumed tiles into result position during first half
      if (t < 0.5) {
        const subT = t / 0.5;
        for (const c of phase.event.consumed) {
          const curCol = c.pos.col + (phase.event.result.pos.col - c.pos.col) * subT;
          const curRow = c.pos.row + (phase.event.result.pos.row - c.pos.row) * subT;
          draws.push({
            id: c.tile.id,
            value: c.tile.value,
            col: curCol,
            row: curRow,
            scale: 1 - subT * 0.15,
            alpha: 1 - subT * 0.35,
          });
        }
      } else {
        // Pop new merged tile in second half
        const subT = (t - 0.5) / 0.5;
        const popScale = this.reducedMotion ? 1 : 1 + Math.sin(subT * Math.PI) * 0.22;
        draws.push({
          id: phase.event.result.tile.id,
          value: phase.event.newValue,
          col: phase.event.result.pos.col,
          row: phase.event.result.pos.row,
          scale: popScale,
          alpha: 1,
          highlight: true,
        });
      }
    } else if (phase.kind === 'GRAVITY') {
      this.pushBoardTiles(phase.boardAfterMerge, draws, phase.movedIds);
      for (const m of phase.event.gravityMoves) {
        const curRow = m.from.row + (m.to.row - m.from.row) * eased;
        draws.push({
          id: m.tileId,
          value: m.value,
          col: m.to.col,
          row: curRow,
          scale: 1,
          alpha: 1,
        });
      }
    }

    return draws;
  }

  pushBoardTiles(
    board,
    out,
    skipIds){
    for (let c = 0; c < board.columns.length; c++) {
      const col = board.columns[c];
      for (let r = 0; r < col.length; r++) {
        const tile = col[r];
        if (skipIds?.has(tile.id)) continue;
        out.push({
          id: tile.id,
          value: tile.value,
          col: c,
          row: r,
          scale: 1,
          alpha: 1,
        });
      }
    }
  }
}


// --- src/renderer/BoardRenderer.ts ---







class BoardRenderer {
  static render(
    ctx,
    metrics,
    params){
    const { cols, maxRows, tileSize, boardX, boardY, boardWidth, boardHeight, launcherSize, launcherY } = metrics;
    const {
      board,
      hoveredCol,
      currentNumber,
      canShootHovered,
      landingRowHovered,
      isReady,
      isAiming = false,
      animations,
      tutorialCol = -1,
      tutorialTimeMs = 0,
    } = params;

    // Board outer container
    ctx.save();
    ctx.fillStyle = '#1E293B';
    TileRenderer.roundRectPath(
      ctx,
      boardX - 10,
      boardY - 10,
      boardWidth + 20,
      boardHeight + 20,
      18
    );
    ctx.fill();
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.2)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();

    // Draw 5 columns + 7 empty slot guides per column
    for (let c = 0; c < cols; c++) {
      const shakeX = animations.getColumnShakeOffset(c);
      const colX = BoardLayout.colToX(metrics, c) + shakeX;
      const isHovered = isReady && c === hoveredCol;

      // Subtle column lane background
      ctx.save();
      ctx.fillStyle = isHovered
        ? canShootHovered
          ? 'rgba(56, 189, 248, 0.08)'
          : 'rgba(248, 113, 113, 0.1)'
        : 'rgba(15, 23, 42, 0.45)';
      TileRenderer.roundRectPath(ctx, colX - 2, boardY - 2, tileSize + 4, boardHeight + 4, 12);
      ctx.fill();
      ctx.restore();

      // Empty slot guides
      for (let r = 0; r < maxRows; r++) {
        const slotY = BoardLayout.rowToY(metrics, r);
        ctx.save();
        ctx.fillStyle = 'rgba(148, 163, 184, 0.07)';
        TileRenderer.roundRectPath(
          ctx,
          colX,
          slotY,
          tileSize,
          tileSize,
          Math.max(8, Math.round(tileSize * 0.16))
        );
        ctx.fill();
        ctx.restore();
      }
    }

    // Dashed aiming guide line & ghost landing preview
    if (isReady && hoveredCol >= 0 && hoveredCol < cols) {
      const shakeX = animations.getColumnShakeOffset(hoveredCol);
      const colX = BoardLayout.colToX(metrics, hoveredCol) + shakeX;
      const centerX = colX + tileSize / 2;
      const startY = launcherY - 2;
      const targetY =
        landingRowHovered >= 0
          ? BoardLayout.rowToY(metrics, landingRowHovered) + tileSize / 2
          : boardY + boardHeight - tileSize / 2;

      ctx.save();
      ctx.strokeStyle = canShootHovered
        ? getTileStyle(currentNumber).bg
        : 'rgba(248, 113, 113, 0.75)';
      ctx.globalAlpha = 0.65;
      ctx.lineWidth = 2.5;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(centerX, startY);
      ctx.lineTo(centerX, targetY);
      ctx.stroke();
      ctx.restore();

      if (canShootHovered && landingRowHovered >= 0) {
        const ghostY = BoardLayout.rowToY(metrics, landingRowHovered);
        TileRenderer.drawTile(ctx, colX, ghostY, tileSize, currentNumber, {
          ghost: true,
          alpha: isAiming ? 0.9 : 0.65,
        });
      }

      // Draw clean launcher rail & full unclipped aiming tile below the 5x7 board
      const railY = launcherY + launcherSize / 2;
      ctx.save();
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.16)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(boardX + 6, railY);
      ctx.lineTo(boardX + boardWidth - 6, railY);
      ctx.stroke();
      ctx.restore();

      const launcherX = centerX - launcherSize / 2;
      TileRenderer.drawTile(ctx, launcherX, launcherY, launcherSize, currentNumber, {
        highlight: isAiming,
        scale: isAiming ? 1.06 : 0.96,
        alpha: isAiming ? 1 : 0.85,
      });
    }

    // Draw tiles (either from active animation timeline or settled board)
    const animatedTiles = animations.getFrameTiles();
    if (animatedTiles) {
      for (const item of animatedTiles) {
        const shakeX = animations.getColumnShakeOffset(Math.round(item.col));
        const px = BoardLayout.colToX(metrics, item.col) + shakeX;
        const py = BoardLayout.rowToY(metrics, item.row);
        TileRenderer.drawTile(ctx, px, py, tileSize, item.value, {
          scale: item.scale,
          alpha: item.alpha,
          highlight: item.highlight,
        });
      }
    } else {
      for (let c = 0; c < board.columns.length; c++) {
        const shakeX = animations.getColumnShakeOffset(c);
        const col = board.columns[c];
        for (let r = 0; r < col.length; r++) {
          const px = BoardLayout.colToX(metrics, c) + shakeX;
          const py = BoardLayout.rowToY(metrics, r);
          TileRenderer.drawTile(ctx, px, py, tileSize, col[r].value);
        }
      }
    }

    // Floating score / chain popups
    for (const ft of animations.floatingTexts) {
      const progress = ft.elapsedMs / ft.durationMs;
      const alpha = Math.max(0, 1 - Math.pow(progress, 1.8));
      const px = BoardLayout.colToX(metrics, ft.pos.col) + tileSize / 2;
      const py = BoardLayout.rowToY(metrics, ft.pos.row) + tileSize * 0.35 - progress * 34;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `800 ${Math.round(tileSize * 0.34)}px "Inter", sans-serif`;
      ctx.strokeStyle = 'rgba(15, 23, 42, 0.9)';
      ctx.lineWidth = 4;
      ctx.strokeText(ft.text, px, py);
      ctx.fillStyle = '#F8FAFC';
      ctx.fillText(ft.text, px, py);

      if (ft.subtext) {
        ctx.font = `800 ${Math.round(tileSize * 0.22)}px "Inter", sans-serif`;
        ctx.strokeText(ft.subtext, px, py - tileSize * 0.3);
        ctx.fillStyle = '#FBBF24';
        ctx.fillText(ft.subtext, px, py - tileSize * 0.3);
      }
      ctx.restore();
    }

    // Confetti particles for milestones
    for (const pt of animations.particles) {
      const pAlpha = Math.max(0, 1 - pt.elapsedMs / pt.durationMs);
      ctx.save();
      ctx.globalAlpha = pAlpha;
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(boardX + pt.x * boardWidth, boardY + pt.y * boardHeight, pt.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Milestone celebration banner (256, 512, 1024, 2048, 4096...)
    const celeb = animations.getCelebrationState();
    if (celeb) {
      const celebP = celeb.progress;
      const val = celeb.value;
      const style = getTileStyle(val);
      const alpha = celebP < 0.18 ? celebP / 0.18 : celebP > 0.8 ? (1 - celebP) / 0.2 : 1;
      const popScale = celebP < 0.2 ? 0.85 + 0.15 * (celebP / 0.2) : 1;

      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
      const bannerW = Math.min(boardWidth * 0.9, 290);
      const bannerH = 68;
      const cx = boardX + boardWidth / 2;
      const cy = boardY + boardHeight * 0.26;
      ctx.translate(cx, cy);
      ctx.scale(popScale, popScale);

      ctx.fillStyle = 'rgba(15, 23, 42, 0.94)';
      TileRenderer.roundRectPath(ctx, -bannerW / 2, -bannerH / 2, bannerW, bannerH, 16);
      ctx.fill();
      ctx.strokeStyle = style.bg;
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Mini tile badge on the left
      const badgeSize = 42;
      TileRenderer.drawTile(ctx, -bannerW / 2 + 12, -badgeSize / 2, badgeSize, val, { highlight: true });

      const title =
        val >= 4096 ? `传奇 ${val}!` :
        val >= 2048 ? `达成 2048` :
        val >= 1024 ? `超神 ${val}!` :
        val >= 512 ? `厉害了 ${val}!` :
        `太棒了 ${val}!`;
      const subtitle =
        val >= 2048 ? '继续合成，冲击更高纪录！' :
        `新纪录！下个目标: ${val * 2}`;

      ctx.fillStyle = style.bg;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.font = '800 18px "Inter", sans-serif';
      ctx.fillText(title, -bannerW / 2 + 66, -10);

      ctx.fillStyle = '#CBD5E1';
      ctx.font = '600 12px "Inter", sans-serif';
      ctx.fillText(subtitle, -bannerW / 2 + 66, 13);
      ctx.restore();
    }

    // Animated interactive tutorial guide (Step 1: tap highlighted column to shoot & merge)
    if (isReady && tutorialCol >= 0 && tutorialCol < cols) {
      const colX = BoardLayout.colToX(metrics, tutorialCol);
      const centerX = colX + tileSize / 2;
      const pulse = 0.5 + 0.5 * Math.sin(tutorialTimeMs / 240);
      const bounceY = Math.sin(tutorialTimeMs / 200) * 7;

      // Glowing column border
      ctx.save();
      ctx.strokeStyle = `rgba(56, 189, 248, ${0.45 + pulse * 0.45})`;
      ctx.lineWidth = 3;
      TileRenderer.roundRectPath(ctx, colX - 2, boardY - 2, tileSize + 4, boardHeight + 4, 12);
      ctx.stroke();

      // Animated target ring at row 1 (landing spot)
      const targetY = BoardLayout.rowToY(metrics, 1) + tileSize / 2;
      ctx.strokeStyle = `rgba(251, 191, 36, ${0.5 + pulse * 0.5})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(centerX, targetY, tileSize * (0.28 + pulse * 0.1), 0, Math.PI * 2);
      ctx.stroke();

      // Bouncing pointer pill + hand icon
      const pillY = boardY + boardHeight * 0.52 + bounceY;
      const pillW = 152;
      const pillH = 34;
      ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
      TileRenderer.roundRectPath(ctx, centerX - pillW / 2, pillY - pillH / 2, pillW, pillH, 17);
      ctx.fill();
      ctx.strokeStyle = '#38BDF8';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#FFFFFF';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '800 13px "Inter", sans-serif';
      ctx.fillText('👆 按住滑到这里松手', centerX, pillY + 1);
      ctx.restore();
    }

    // Animated interactive tutorial guide (Step 1: tap highlighted column to shoot & merge)
    if (isReady && tutorialCol >= 0 && tutorialCol < cols) {
      const colX = BoardLayout.colToX(metrics, tutorialCol);
      const centerX = colX + tileSize / 2;
      const pulse = 0.5 + 0.5 * Math.sin(tutorialTimeMs / 240);
      const bounceY = Math.sin(tutorialTimeMs / 200) * 7;

      // Glowing column border
      ctx.save();
      ctx.strokeStyle = `rgba(56, 189, 248, ${0.45 + pulse * 0.45})`;
      ctx.lineWidth = 3;
      TileRenderer.roundRectPath(ctx, colX - 2, boardY - 2, tileSize + 4, boardHeight + 4, 12);
      ctx.stroke();

      // Animated target ring at row 1 (landing spot)
      const targetY = BoardLayout.rowToY(metrics, 1) + tileSize / 2;
      ctx.strokeStyle = `rgba(251, 191, 36, ${0.5 + pulse * 0.5})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(centerX, targetY, tileSize * (0.28 + pulse * 0.1), 0, Math.PI * 2);
      ctx.stroke();

      // Bouncing pointer pill + hand icon
      const pillY = boardY + boardHeight * 0.52 + bounceY;
      const pillW = 152;
      const pillH = 34;
      ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
      TileRenderer.roundRectPath(ctx, centerX - pillW / 2, pillY - pillH / 2, pillW, pillH, 17);
      ctx.fill();
      ctx.strokeStyle = '#38BDF8';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#FFFFFF';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '800 13px "Inter", sans-serif';
      ctx.fillText('👆 按住滑到这里松手', centerX, pillY + 1);
      ctx.restore();
    }
  }
}

// --- src/renderer/GameRenderer.ts ---





class GameRenderer {
  ctx;
  metrics;
  dpr = 1;
  hoveredCol = 2;
  rafId = null;
  tutorialCol = -1;
  isAiming = false;
  lastFrameMs = 0;

  constructor(
    canvas,
    gameManager,
    animations) {
    this.canvas = canvas;
    this.gameManager = gameManager;
    this.animations = animations;
    const context = canvas.getContext('2d');
    if (!context) {
      throw new Error('Could not initialize 2D canvas context');
    }
    this.ctx = context;
    this.metrics = BoardLayout.compute(360, 500);
    this.resize();
  }

  resize(){
    const rect = this.canvas.getBoundingClientRect();
    const width = Math.max(240, Math.floor(rect.width || 360));
    const height = Math.max(320, Math.floor(rect.height || 500));
    this.dpr = Math.min(window.devicePixelRatio || 1, 2.5);

    this.canvas.width = Math.floor(width * this.dpr);
    this.canvas.height = Math.floor(height * this.dpr);
    this.metrics = BoardLayout.compute(width, height);
    if (typeof document !== 'undefined') {
      document.documentElement.style.setProperty('--board-frame-w', `${this.metrics.boardWidth + 20}px`);
    }
    this.renderOnce();
  }

  getMetrics(){
    return this.metrics;
  }

  setHoveredCol(col){
    if (col >= 0 && col < this.gameManager.board.cols && this.hoveredCol !== col) {
      this.hoveredCol = col;
      this.renderOnce();
    }
  }

  getHoveredCol(){
    return this.hoveredCol;
  }

  setAiming(aiming){
    if (this.isAiming !== aiming) {
      this.isAiming = aiming;
      this.renderOnce();
    }
  }

  setTutorialCol(col){
    this.tutorialCol = col;
    if (col >= 0) {
      this.hoveredCol = col;
      this.ensureAnimating();
    } else {
      this.renderOnce();
    }
  }

  startLoop(){
    if (this.rafId !== null) return;
    this.lastFrameMs = performance.now();
    const tick = (now) => {
      const dt = Math.min(64, Math.max(0, now - this.lastFrameMs));
      this.lastFrameMs = now;

      this.animations.update(dt);
      this.renderOnce();

      if (this.animations.hasActiveEffects() || this.tutorialCol >= 0) {
        this.rafId = requestAnimationFrame(tick);
      } else {
        this.rafId = null;
      }
    };
    this.rafId = requestAnimationFrame(tick);
  }

  ensureAnimating(){
    if (this.rafId === null) {
      this.startLoop();
    }
  }

  renderOnce(){
    const { canvasWidth, canvasHeight } = this.metrics;
    this.ctx.save();
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.ctx.clearRect(0, 0, canvasWidth, canvasHeight);

    const isReady = this.gameManager.getState() === GameState.READY;
    const canShootHovered = isReady && this.gameManager.canShootToColumn(this.hoveredCol);
    const landingRowHovered = canShootHovered
      ? this.gameManager.board.getLandingRow(this.hoveredCol)
      : -1;

    BoardRenderer.render(this.ctx, this.metrics, {
      board: this.gameManager.getBoardSnapshot(),
      hoveredCol: this.hoveredCol,
      currentNumber: this.gameManager.getCurrentNumber(),
      canShootHovered,
      landingRowHovered,
      isReady,
      isAiming: this.isAiming,
      animations: this.animations,
      tutorialCol: this.tutorialCol,
      tutorialTimeMs: performance.now(),
    });

    this.ctx.restore();
  }
}


// --- src/input/InputManager.ts ---





class InputManager {
  selectedCol = 2;
  isPressing = false;
  activePointerId = null;

  constructor(
    canvas,
    renderer,
    handlers) {
    this.canvas = canvas;
    this.renderer = renderer;
    this.handlers = handlers;
    this.bindEvents();
  }

  getCanvasX(clientX){
    const rect = this.canvas.getBoundingClientRect();
    return clientX - rect.left;
  }

  updateColumnFromClientX(clientX){
    const col = BoardLayout.pixelToCol(this.renderer.getMetrics(), this.getCanvasX(clientX));
    if (col !== -1) {
      this.selectedCol = col;
      this.handlers.onSelectColumn(col);
    }
    return col;
  }

  bindEvents(){
    this.canvas.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      this.isPressing = true;
      this.activePointerId = e.pointerId;
      try {
        this.canvas.setPointerCapture?.(e.pointerId);
      } catch {
        // Ignore in environments without pointer capture
      }
      this.updateColumnFromClientX(e.clientX);
      this.handlers.onAimStateChange?.(true);
    });

    this.canvas.addEventListener('pointermove', (e) => {
      if (this.isPressing) {
        if (this.activePointerId !== null && e.pointerId !== this.activePointerId) return;
        this.updateColumnFromClientX(e.clientX);
      } else if (e.pointerType === 'mouse') {
        this.updateColumnFromClientX(e.clientX);
      }
    });

    const releasePointer = (e, shouldShoot) => {
      if (!this.isPressing) return;
      if (this.activePointerId !== null && e.pointerId !== this.activePointerId) return;

      const col = this.updateColumnFromClientX(e.clientX);
      this.isPressing = false;
      this.activePointerId = null;
      this.handlers.onAimStateChange?.(false);

      if (shouldShoot && col !== -1) {
        this.handlers.onShootColumn(col);
      }
    };

    this.canvas.addEventListener('pointerup', (e) => releasePointer(e, true));
    this.canvas.addEventListener('pointercancel', (e) => releasePointer(e, false));

    window.addEventListener('keydown', (e) => {
      const key = e.key;
      if (key === ' ' || key === 'ArrowLeft' || key === 'ArrowRight' || key === 'ArrowUp' || key === 'ArrowDown') {
        e.preventDefault();
      }

      if (key >= '1' && key <= String(GAME_CONFIG.board.cols)) {
        const col = parseInt(key, 10) - 1;
        this.selectedCol = col;
        this.handlers.onSelectColumn(col);
        this.handlers.onShootColumn(col);
        return;
      }

      if (key === 'ArrowLeft') {
        this.selectedCol = Math.max(0, this.selectedCol - 1);
        this.handlers.onSelectColumn(this.selectedCol);
        return;
      }

      if (key === 'ArrowRight') {
        this.selectedCol = Math.min(GAME_CONFIG.board.cols - 1, this.selectedCol + 1);
        this.handlers.onSelectColumn(this.selectedCol);
        return;
      }

      if (key === ' ' || key === 'Enter') {
        this.handlers.onShootColumn(this.selectedCol);
        return;
      }

      if (key === 's' || key === 'S') {
        this.handlers.onSwap();
      }
    });
  }
}


// --- src/ui/GameUI.ts ---





class GameUI {
  scoreEl = document.getElementById('hud-score');
  bestEl = document.getElementById('hud-best');
  biggestEl = document.getElementById('hud-biggest');

  currentTileEl = document.getElementById('launcher-current');
  nextTileEl = document.getElementById('launcher-next');
  currentSlotEl = document.getElementById('current-slot');
  swapBtnEl = document.getElementById('btn-swap');
  swapHintEl = document.getElementById('swap-hint');
  feedbackEl = document.getElementById('feedback-toast');

  soundBtnEl = document.getElementById('btn-sound');
  motionBtnEl = document.getElementById('btn-motion');
  restartBtnEl = document.getElementById('btn-restart');
  skipTutBtnEl = document.getElementById('btn-skip-tutorial');

  gameOverModalEl = document.getElementById('gameover-modal');
  finalScoreEl = document.getElementById('go-score');
  finalBestEl = document.getElementById('go-best');
  finalBiggestEl = document.getElementById('go-biggest');
  finalStatsEl = document.getElementById('go-stats');
  playAgainBtnEl = document.getElementById('btn-play-again');

  toastTimer = null;

  constructor(actions) {
    this.actions = actions;
    this.swapBtnEl.addEventListener('click', () => this.actions.onSwap());
    this.restartBtnEl.addEventListener('click', () => this.actions.onRestart());
    this.playAgainBtnEl.addEventListener('click', () => this.actions.onRestart());
    this.soundBtnEl.addEventListener('click', () => this.actions.onToggleSound());
    this.motionBtnEl.addEventListener('click', () => this.actions.onToggleReducedMotion());
    this.skipTutBtnEl.addEventListener('click', () => this.actions.onSkipTutorial());
  }

  sync(
    gm,
    soundEnabled,
    reducedMotion,
    tutorialStep = 0
  ){
    const snap = gm.getScoreSnapshot();
    this.scoreEl.textContent = snap.score.toLocaleString();
    this.bestEl.textContent = snap.bestScore.toLocaleString();
    this.biggestEl.textContent = snap.biggestTile > 0 ? String(snap.biggestTile) : '—';

    this.applyTileBadge(this.currentTileEl, gm.getCurrentNumber());
    this.applyTileBadge(this.nextTileEl, gm.getNextNumber());

    const isGameOver = gm.getState() === GameState.GAME_OVER;
    const isReady = gm.getState() === GameState.READY;
    this.swapBtnEl.disabled = !isReady;

    const swapRec = gm.isSwapRecommended();
    this.swapHintEl.classList.toggle('visible', swapRec);
    this.swapBtnEl.classList.toggle('pulse-hint', swapRec);

    this.soundBtnEl.textContent = soundEnabled ? '🔊 音效' : '🔇 静音';
    this.soundBtnEl.setAttribute('aria-pressed', String(soundEnabled));

    this.motionBtnEl.textContent = reducedMotion ? '⚡ 简化' : '✨ 动效';
    this.motionBtnEl.setAttribute('aria-pressed', String(reducedMotion));

    this.skipTutBtnEl.classList.toggle('visible', tutorialStep > 0);
    this.currentSlotEl.classList.toggle('tut-highlight', tutorialStep === 2);

    if (isGameOver) {
      this.finalScoreEl.textContent = snap.score.toLocaleString();
      this.finalBestEl.textContent = snap.bestScore.toLocaleString();
      this.finalBiggestEl.textContent = String(snap.biggestTile);
      this.finalStatsEl.textContent = `合成次数: ${snap.mergeCount} · 最高连击: ${snap.maxChainCount}x`;
      this.gameOverModalEl.classList.add('open');
    } else {
      this.gameOverModalEl.classList.remove('open');
    }
  }

  applyTileBadge(el, value){
    const style = getTileStyle(value);
    el.textContent = String(value);
    el.style.backgroundColor = style.bg;
    el.style.borderBottomColor = style.bgDark;
    el.style.color = '#FFFFFF';
    const len = String(value).length;
    el.style.fontSize = len <= 2 ? '1.35rem' : len === 3 ? '1.1rem' : '0.92rem';
  }

  showFeedback(message){
    this.feedbackEl.textContent = message;
    this.feedbackEl.classList.add('visible');
    if (this.toastTimer !== null) {
      window.clearTimeout(this.toastTimer);
    }
    this.toastTimer = window.setTimeout(() => {
      this.feedbackEl.classList.remove('visible');
    }, 1500);
  }
}


// --- src/main.ts ---








function bootstrap(){
  const canvas = document.getElementById('game-canvas');
  if (!canvas) {
    throw new Error('Missing #game-canvas element');
  }

  const saved = SaveManager.load();
  let soundEnabled = saved.soundEnabled;
  let reducedMotion = saved.reducedMotion;
  // 0 = inactive, 1 = tap col 2 to shoot & merge 2+2=4, 2 = look at Next tile
  let tutorialStep = saved.tutorialSeen ? 0 : 1;

  const audio = new AudioManager(soundEnabled);
  const animations = new AnimationManager(audio);
  animations.setReducedMotion(reducedMotion);

  const gameManager = new GameManager({
    initialBestScore: saved.bestScore,
    initialBestTile: saved.bestTile,
  });

  const setupTutorialBoard = () => {
    animations.reset();
    gameManager.reset();
    gameManager.board.loadColumns([[], [], [2], [], []]);
    gameManager.setQueueForTesting(2, 4);
    tutorialStep = 1;
    renderer.setTutorialCol(2);
    ui.sync(gameManager, soundEnabled, reducedMotion, tutorialStep);
  };

  const finishTutorial = () => {
    tutorialStep = 0;
    renderer.setTutorialCol(-1);
    SaveManager.saveTutorialSeen(true);
    ui.sync(gameManager, soundEnabled, reducedMotion, tutorialStep);
  };

  const persistRun = () => {
    if (gameManager.getState() === GameState.GAME_OVER) {
      SaveManager.clearRunState();
    } else {
      SaveManager.saveRunState(gameManager.exportRunState());
    }
  };

  const renderer = new GameRenderer(canvas, gameManager, animations);

  const ui = new GameUI({
    onSwap: () => {
      if (gameManager.swap()) {
        audio.playSwap();
        if (tutorialStep === 2) {
          finishTutorial();
        } else {
          ui.sync(gameManager, soundEnabled, reducedMotion, tutorialStep);
        }
        persistRun();
        renderer.renderOnce();
      }
    },
    onRestart: () => {
      animations.reset();
      gameManager.reset();
      SaveManager.clearRunState();
      tutorialStep = 0;
      renderer.setTutorialCol(-1);
      ui.sync(gameManager, soundEnabled, reducedMotion, tutorialStep);
      renderer.renderOnce();
    },
    onToggleSound: () => {
      soundEnabled = !soundEnabled;
      audio.setEnabled(soundEnabled);
      SaveManager.saveSoundEnabled(soundEnabled);
      ui.sync(gameManager, soundEnabled, reducedMotion, tutorialStep);
    },
    onToggleReducedMotion: () => {
      reducedMotion = !reducedMotion;
      animations.setReducedMotion(reducedMotion);
      SaveManager.saveReducedMotion(reducedMotion);
      ui.sync(gameManager, soundEnabled, reducedMotion, tutorialStep);
    },
    onSkipTutorial: () => {
      finishTutorial();
    },
  });

  new InputManager(canvas, renderer, {
    onSelectColumn: (col) => {
      renderer.setHoveredCol(col);
    },
    onAimStateChange: (aiming) => {
      renderer.setAiming(aiming);
    },
    onShootColumn: (col) => {
      if (gameManager.getState() !== GameState.READY || animations.isAnimating()) {
        return;
      }

      if (tutorialStep === 1 && col !== 2) {
        ui.showFeedback('请按住滑到中间高亮列再松手，试试合成 4！');
        return;
      }

      const boardBefore = gameManager.getBoardSnapshot();
      const result = gameManager.shoot(col, true);

      if (!result.ok) {
        if (result.reason === 'COLUMN_FULL') {
          audio.playInvalid();
          animations.triggerInvalidShake(col);
          renderer.ensureAnimating();
          ui.showFeedback('该列已满！请匹配最底部数字或换一列');
        }
        return;
      }

      audio.playShoot();

      const snap = gameManager.getScoreSnapshot();
      SaveManager.saveBestScore(snap.bestScore);
      SaveManager.saveBestTile(snap.allTimeBiggestTile);
      persistRun();

      if (tutorialStep === 1) {
        renderer.setTutorialCol(-1);
      }

      ui.sync(gameManager, soundEnabled, reducedMotion, tutorialStep);

      animations.startShotTimeline(boardBefore, result, () => {
        gameManager.finishAnimation();
        if (result.newMilestoneValue !== null) {
          audio.playMilestone(result.newMilestoneValue);
        }
        if (gameManager.getState() === GameState.GAME_OVER) {
          audio.playGameOver();
        }
        if (tutorialStep === 1) {
          tutorialStep = 2;
        } else if (tutorialStep === 2) {
          finishTutorial();
        }
        ui.sync(gameManager, soundEnabled, reducedMotion, tutorialStep);
        renderer.renderOnce();
      });

      renderer.ensureAnimating();
    },
    onSwap: () => {
      if (gameManager.swap()) {
        audio.playSwap();
        if (tutorialStep === 2) {
          finishTutorial();
        } else {
          ui.sync(gameManager, soundEnabled, reducedMotion, tutorialStep);
        }
        persistRun();
        renderer.renderOnce();
      }
    },
  });

  window.addEventListener('resize', () => renderer.resize());
  const savedRun = SaveManager.loadRunState();
  if (savedRun && saved.tutorialSeen) {
    gameManager.restoreRunState(savedRun);
    if (gameManager.getState() === GameState.GAME_OVER) {
      SaveManager.clearRunState();
      gameManager.reset();
    }
    ui.sync(gameManager, soundEnabled, reducedMotion, tutorialStep);
    renderer.renderOnce();
  } else if (tutorialStep === 1) {
    setupTutorialBoard();
  } else {
    ui.sync(gameManager, soundEnabled, reducedMotion, tutorialStep);
    renderer.renderOnce();
  }
}

bootstrap();

})();
